<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tasbih Tracker</title>
<style>
:root{--p:#1DC4B2;--pd:#0E8F81;--on:#05312d;--bg:#f4fbfa;--card:#fff;--tx:#12302d;--mu:#6b8480;--soft:#dff6f3;--bd:#bfe8e3;--red:#d64545;--ok:#2ea44f;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);box-sizing:border-box}
:root[data-theme=dark]{--bg:#0d1f1d;--card:#142b28;--tx:#e6f6f4;--mu:#8fb0ab;--soft:#173833;--bd:#245650}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
header{background:var(--p);color:var(--on);padding:calc(var(--sat) + 14px) 16px 14px;text-align:center;font-size:20px;font-weight:700;position:relative;flex:none}
header .back{position:absolute;left:10px;bottom:10px;background:none;border:0;font-size:26px;color:var(--on);padding:4px 10px}
header .thm{position:absolute;right:10px;bottom:10px;background:none;border:0;font-size:22px;padding:4px 8px}
main{flex:1;overflow-y:auto;padding:16px}
nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:var(--sab)}
nav button{flex:1;background:none;border:0;padding:10px 0 8px;color:var(--mu);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .i{font-size:22px;line-height:1}
nav button.on{color:var(--pd);font-weight:700}
.fab{position:absolute;right:18px;bottom:calc(var(--sab) + 84px);width:56px;height:56px;border-radius:50%;background:var(--p);color:var(--on);border:0;font-size:30px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:5px solid var(--p)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.t{font-size:18px;font-weight:700}
.mu{color:var(--mu);font-size:13px}
.bar{height:9px;border-radius:9px;background:var(--soft);overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--p);border-radius:9px}
.stats{display:flex;justify-content:space-between;font-size:13px;color:var(--mu)}
.stats b{color:var(--pd)}
.btn{background:var(--p);color:var(--on);border:0;border-radius:30px;padding:14px;font-size:16px;font-weight:700;width:100%}
.circ{width:48px;height:48px;border-radius:50%;border:0;font-size:24px;flex:none;background:var(--soft);color:var(--pd)}
.circ.m{background:#fbe3e3;color:var(--red)}
.empty{text-align:center;color:var(--mu);margin-top:25vh}
.empty .big{font-size:60px}
input,textarea,select{width:100%;border:1.5px solid var(--p);border-radius:16px;padding:14px;font-size:16px;background:var(--card);color:var(--tx);margin-bottom:12px;font-family:inherit}
h3{color:var(--pd);margin:14px 0 8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;background:var(--soft);border:1px solid var(--bd);border-radius:30px;padding:10px 18px;font-size:20px;color:var(--tx);font-family:"Amiri","Traditional Arabic",serif}
.tap{width:230px;height:230px;border-radius:50%;border:0;background:var(--p);color:var(--on);font-size:64px;font-weight:800;box-shadow:0 8px 24px rgba(29,196,178,.5);margin:18px auto;display:block;user-select:none;touch-action:manipulation}
.tap:active{transform:scale(.96)}
.hero{background:var(--p);color:var(--on);text-align:center;padding:calc(var(--sat) + 12px) 16px 22px;flex:none;position:relative}
.ring{width:150px;height:150px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center}
.ring div{width:118px;height:118px;border-radius:50%;background:var(--p);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.s3{display:flex;gap:10px;margin-bottom:14px}
.s3 div{flex:1;background:var(--card);border-radius:16px;padding:14px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.s3 b{display:block;font-size:20px}
.quote{background:#fff6dc;color:#6b5200;border:1px solid #f1d98a;border-radius:14px;padding:14px;font-style:italic;margin-bottom:16px}
.tl{border-left:3px solid var(--bd);margin-left:8px;padding-left:14px}
.tl .card{border-left:0;position:relative}
.tl .card:before{content:"";position:absolute;left:-24px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--pd)}
.tabs{display:flex;background:var(--p);flex:none}
.tabs button{flex:1;background:none;border:0;padding:12px;font-size:16px;color:rgba(5,49,45,.6);border-bottom:3px solid transparent}
.tabs button.on{color:var(--on);font-weight:700;border-color:#f5b400}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
#modal .box{background:var(--card);border-radius:20px;padding:20px;width:100%}
#splash{position:absolute;inset:0;z-index:30;background:linear-gradient(#0e8f81,#1DC4B2);color:var(--on);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .4s}
#splash .logo{width:110px;height:110px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:56px;margin-bottom:20px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{color:var(--mu);font-size:12px;padding:6px 0}
.cd{aspect-ratio:1;border:0;background:none;color:var(--tx);border-radius:50%;font-size:15px;padding:0}
.cd.dim{color:var(--mu);opacity:.55}.cd.part{background:var(--soft)}.cd.ok{background:#2ea44f;color:#fff}.cd.td{box-shadow:inset 0 0 0 2px var(--pd)}.cd.sel{background:var(--p);color:var(--on);font-weight:700}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ins div{background:var(--card);border-radius:18px;padding:18px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}.ins b{display:block;font-size:30px;margin:6px 0}
.badge{background:var(--soft);color:#2ea44f;border-radius:20px;padding:6px 14px;font-weight:700;font-size:13px}
.qv .card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.07)}
.qv .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qv .t{font-size:18px;font-weight:700}
.qv .mu{color:var(--mu);font-size:13px}
.qv .bar{height:9px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}
.qv .bar i{display:block;height:100%;background:var(--pd);border-radius:9px}
.qv .btn{background:var(--p);color:var(--on);border:0;border-radius:30px;padding:14px;font-size:16px;font-weight:700;width:100%}
.qv .btn2{background:var(--soft);color:var(--pd)}
.qv .circ{width:44px;height:44px;border-radius:50%;border:0;font-size:22px;flex:none;background:var(--soft);color:var(--pd)}
.qv .empty{text-align:center;color:var(--mu);margin-top:16vh}
.qv .chip{background:var(--soft);border:1px solid var(--bd);border-radius:30px;padding:8px 16px;font-size:14px;color:var(--tx)}
.qv .chip.on{background:var(--p);color:var(--on);font-weight:700}
.qv .chips{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.qv .grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}
.qv .g{aspect-ratio:1;border:0;border-radius:7px;background:var(--soft);color:var(--tx);font-size:11px;padding:0}
.qv .g.p{background:#7ddfd3;color:#05312d}
.qv .g.f{background:var(--pd);color:#fff}
.qv .tb{background:var(--soft);border-radius:16px;padding:12px 14px;margin-top:14px}
.qv .rg{width:66px;height:66px;border-radius:50%;background:conic-gradient(var(--pd) var(--d),var(--bd) 0);display:flex;align-items:center;justify-content:center;flex:none}
.qv .rg div{width:52px;height:52px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--pd)}
.qv .rg.big{width:130px;height:130px}
.qv .rg.big div{width:104px;height:104px;font-size:26px}
.qv .hero{background:linear-gradient(135deg,#1DC4B2,#8fe6dc);color:#05312d;border-radius:22px;padding:18px;margin-bottom:14px}
.qv .seg{display:flex;background:var(--soft);border-radius:30px;padding:4px;margin-bottom:14px}
.qv .seg button{flex:1;border:0;background:none;padding:10px;border-radius:26px;color:var(--mu);font-weight:600;font-size:14px}
.qv .seg button.on{background:var(--card);color:var(--pd);box-shadow:0 1px 6px rgba(0,0,0,.12)}
.qv .badge{background:var(--soft);color:var(--ok);border-radius:20px;padding:6px 14px;font-weight:700;font-size:13px}
.qv .s3{display:flex;gap:10px;margin-bottom:14px}
.qv .s3 div{flex:1;background:var(--card);border-radius:16px;padding:14px 6px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.qv .s3 b{display:block;font-size:20px}
.qv .ring{width:200px;height:200px;border-radius:50%;margin:10px auto;display:flex;align-items:center;justify-content:center}
.qv .ring div{width:140px;height:140px;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;font-weight:800}
.qv .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.qv .cal .h{color:var(--mu);font-size:12px;padding:6px 0}
.qv .cd{aspect-ratio:1;border:0;background:none;color:var(--tx);border-radius:50%;font-size:15px;padding:0}
.qv .cd.part{background:var(--soft)}
.qv .cd.td{box-shadow:inset 0 0 0 2px var(--pd)}
.qv .cd.sel{background:var(--p);color:var(--on);font-weight:700}
.qv .chip{font-family:inherit}.qv .chips{overflow:visible;padding-bottom:0}.qv .card{border-left:0}.qv .hero{text-align:left}
.fab.pill{width:auto;padding:0 22px;height:54px;border-radius:30px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div id="splash"><div class="logo">📖</div><div style="font-size:30px;font-weight:800">Tasbih Tracker</div><div style="margin-top:8px">Track your daily tasbih counts with ease</div></div>
  <div id="head"></div>
  <main id="main"></main>
  <button class="fab" id="fab">+</button>
  <nav id="nav"></nav>
  <div id="modal"><div class="box" id="mbox"></div></div>
</div>
<script>
var S={tasbihs:[],chals:[],sel:'',day:''};
try{var raw=localStorage.getItem('tt1');if(raw)S=JSON.parse(raw)}catch(e){}
S.tasbihs=S.tasbihs||[];S.chals=S.chals||[];S.hist=S.hist||{};S.nm=S.nm||{};if(!S.theme){try{S.theme=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}catch(e){S.theme='light'}}document.documentElement.setAttribute('data-theme',S.theme);
var V={tab:'rep',sub:null,ctab:'active',cid:null,draft:{},rp:'day',rd:Date.now()};
function save(){try{localStorage.setItem('tt1',JSON.stringify(S))}catch(e){}}
function today(){return new Date().toDateString()}
function rollDay(){if(S.day!==today()){S.day=today();S.tasbihs.forEach(function(t){t.today=0});save()}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(ts){var d=new Date(ts),m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()],h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;var mi=('0'+d.getMinutes()).slice(-2);return d.getDate()+' '+m+', '+String(d.getFullYear()).slice(2)+' at '+h+':'+mi+' '+ap}
function pct(c){var p=c.goal?c.current/c.goal*100:0;return Math.min(100,p)}
function pctTxt(c){var p=pct(c);return (p<10&&p>0?p.toFixed(1):Math.round(p))+'%'}
var $=function(id){return document.getElementById(id)};
function ask(title,ph,cb){$('mbox').className='box';
  $('mbox').innerHTML='<div class="t" style="margin-bottom:12px">'+esc(title)+'</div><input id="mi" type="number" inputmode="numeric" placeholder="'+esc(ph)+'"><div class="row"><button class="btn" id="mc" style="background:var(--soft);color:var(--pd)">Cancel</button><button class="btn" id="mo">OK</button></div>';
  $('modal').style.display='flex';$('mi').focus();
  $('mc').onclick=function(){$('modal').style.display='none'};
  $('mo').onclick=function(){var v=parseInt($('mi').value,10);$('modal').style.display='none';if(v>0)cb(v)};
}
function addChal(c,n,lg){
  var from=c.current,to=Math.max(0,from+n);if(lg)c.log.unshift({from:from,add:n,to:to,t:Date.now()});c.current=to;
  if(c.current>=c.goal&&!c.done){c.done=true}
  save();render();
}
function render(){
  rollDay();
  var h='',m='',fab=false,nav=true;
  var titles={rep:'Overview',log:'Tasbih Log',counter:'Counter',chal:'Challenges',about:'About Developer'};
  if(V.tab==='q'){var qv=qview();h='<header>'+(qv.back?'<button class="back" onclick="QV.sub=null;render()">←</button>':'')+'<button class="thm" onclick="toggleTheme()">'+(S.theme==='dark'?'☀️':'🌙')+'</button>'+qv.title+'</header>';m=qv.m;fab=qv.fab;nav=qv.nav}else if(V.sub==='add'){
    h='<header><button class="back" onclick="V.sub=null;render()">←</button>Add Tasbih</header>';
    var lib=['سبحان الله','الحمد لله','الله أكبر','لا إله إلا الله','أستغفر الله'];
    m='<h3 style="margin-top:0">Quick Library</h3><div class="chips">'+lib.map(function(x,i){var tr=['SubhanAllah','Alhamdulillah','Allahu Akbar','La ilaha illallah','Astaghfirullah'][i];return '<button class="chip" onclick="$(\'fn\').value=\''+x+'\';$(\'fd\').value=\''+tr+'\'">'+x+'</button>'}).join('')+'</div>'
     +'<h3>Tasbih Details</h3><input id="fn" placeholder="Tasbih Name"><textarea id="fd" rows="4" placeholder="Description"></textarea><input id="fg" type="number" inputmode="numeric" placeholder="Daily Goal">'
     +'<h3>Daily Reminder</h3><input id="fr" type="time"><button class="btn" id="fs">Save</button>';
    nav=false;
  }else if(V.sub==='addc'){
    h='<header><button class="back" onclick="V.sub=null;render()">←</button>New Challenge</header>';
    m='<input id="cn" placeholder="Challenge Name (e.g. সায়্যিদুল ইস্তেগফার)"><input id="cg" type="number" inputmode="numeric" placeholder="Goal (e.g. 100000)"><button class="btn" id="cs">Start Challenge</button>';
    nav=false;
  }else if(V.sub==='td'){
    var tt=tget(V.tid);
    if(!tt){V.sub=null;return render()}
    h='<header><button class="back" onclick="V.sub=null;render()">←</button>'+esc(tt.name)+'</header>';
    m=tdHTML(tt);
  }else if(V.sub==='cd'){
    var c=S.chals.filter(function(x){return x.id===V.cid})[0];
    if(!c){V.sub=null;return render()}
    var deg=pct(c)*3.6;
    h='<div class="hero"><button class="back" style="top:calc(var(--sat) + 10px);bottom:auto" onclick="V.sub=null;render()">←</button><div class="ring" style="background:conic-gradient(#f5b400 '+deg+'deg,rgba(5,49,45,.18) 0)"><div>'+pctTxt(c)+'<small style="font-size:13px;font-weight:400">Progress</small></div></div><div class="t" style="font-size:24px">'+esc(c.name)+'</div></div>';
    m='<div class="s3"><div>🚩<b>'+c.goal+'</b><span class="mu">Target</span></div><div>✅<b>'+c.current+'</b><span class="mu">Current</span></div><div>⏳<b>'+Math.max(0,c.goal-c.current)+'</b><span class="mu">Remaining</span></div></div>'
     +'<div class="quote">✨ Every step counts. Keep going!</div><div class="t" style="margin-bottom:12px">Activity Timeline</div><div class="tl">'
     +(c.log.length?c.log.map(function(l){return '<div class="card"><div class="row"><div><div class="t" style="font-size:16px">'+(l.add>=0?'Added to count':'Removed from count')+'</div><div style="color:var(--pd);margin:6px 0">'+l.from+(l.add>=0?' + ':' − ')+Math.abs(l.add)+' = '+l.to+'</div><div class="mu">'+fmt(l.t)+'</div></div><div style="text-align:right"><div class="mu">Total</div><div class="t" style="font-size:24px">'+l.to+'</div></div></div></div>'}).join(''):'<div class="mu">No activity yet</div>')+'</div>';
    nav=false;
  }else{
    h='<header><button class="thm" onclick="toggleTheme()">'+(S.theme==='dark'?'☀️':'🌙')+'</button>'+titles[V.tab]+'</header>';
    if(V.tab==='rep'){
      h+='<div class="tabs">'+[['day','Day'],['week','Week'],['month','Month'],['year','Year']].map(function(x){return '<button class="'+(V.rp===x[0]?'on':'')+'" onclick="V.rp=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join('')+'</div>';
      m=repHTML();
    }else if(V.tab==='log'){
      fab=true;
      m=S.tasbihs.length?S.tasbihs.map(function(t){var g=t.goal||0,p=g?Math.min(100,t.today/g*100):0;return '<div class="card"><div class="row"><div class="t">'+esc(t.name)+'</div><button class="circ m" style="width:36px;height:36px;font-size:16px" onclick="delT('+t.id+')">🗑</button></div>'+(t.desc?'<div class="mu">'+esc(t.desc)+'</div>':'')+'<div class="bar"><i style="width:'+p+'%"></i></div><div class="stats"><span>Today: <b>'+t.today+'</b></span><span>Daily goal: <b>'+(g||'—')+'</b></span><span>Total: <b>'+t.total+'</b></span></div>'+(t.rem?'<div class="mu" style="margin-top:8px">🔔 '+t.rem+'</div>':'')+'</div>'}).join('')
      :'<div class="empty"><div class="big">🔖</div><div class="t" style="margin-top:14px;color:var(--mu)">No Tasbihs Added</div><div style="margin-top:10px">Tap + to add your first Tasbih</div></div>';
    }else if(V.tab==='counter'){fab=true;m=counterHTML();}else if(V.tab==='counterOLD'){
      if(!S.tasbihs.length){m='<div class="empty"><div class="big">📿</div><div class="t" style="margin-top:14px;color:var(--mu)">No Tasbihs Added<div class="mu" style="margin-top:10px;font-weight:400">Tap + to add your first Tasbih</div></div></div>'}
      else{
        var cur=S.tasbihs.filter(function(t){return String(t.id)===String(S.sel)})[0]||S.tasbihs[0];S.sel=cur.id;
        m='<select id="sel" onchange="S.sel=this.value;save();render()">'+S.tasbihs.map(function(t){return '<option value="'+t.id+'"'+(t.id===cur.id?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select>'
         +'<button class="tap" id="tap">'+cur.today+'</button><div style="text-align:center" class="mu">Today'+(cur.goal?' / Goal '+cur.goal:'')+' · Total '+cur.total+'</div>'
         +'<div class="row" style="margin-top:18px"><button class="circ m" id="cm">−</button><button class="btn" onclick="askAdd()">+ Add Count</button><button class="circ" onclick="rec(cur(),1);render()">+</button></div><div class="row" style="margin-top:12px"><button class="btn" id="cr" style="background:var(--soft);color:var(--pd)">Reset today</button><button class="btn" style="background:#fbe3e3;color:var(--red)" onclick="delT('+cur.id+')">Delete</button></div>';
      }
    }else if(V.tab==='chal'){
      fab=true;
      var list=S.chals.filter(function(c){return V.ctab==='active'?!c.done:c.done});
      h+='<div class="tabs"><button class="'+(V.ctab==='active'?'on':'')+'" onclick="V.ctab=\'active\';render()">Active</button><button class="'+(V.ctab==='done'?'on':'')+'" onclick="V.ctab=\'done\';render()">Completed</button></div>';
      m=list.length?list.map(function(c){return '<div class="card"><div class="row" onclick="openC('+c.id+')"><div class="t">⭐ '+esc(c.name)+'</div><button class="circ" style="width:34px;height:34px;font-size:16px;background:none;color:var(--red)" onclick="event.stopPropagation();delC('+c.id+')">🗑</button></div>'
        +'<div class="row" style="margin-top:12px"><span class="mu">Progress</span><b style="color:var(--pd)">'+pctTxt(c)+'</b></div><div class="bar"><i style="width:'+pct(c)+'%"></i></div>'
        +'<div class="stats"><span>🚩 Goal: <b>'+c.goal+'</b></span><span>✅ Current: <b>'+c.current+'</b></span><span>⏳ Left: <b>'+Math.max(0,c.goal-c.current)+'</b></span></div>'

function tu(id,i){var j=gj(id),u=units(j)[i];mark(j,u.a,u.b,nread(j,u.a,u.b)<u.b-u.a+1);q_render()}
function setU(id,u){gj(id).u=u;q_save();q_render()}
function firstUnread(j){for(var p=j.a;p<=j.b;p++)if(!j.read[p])return p;return j.b}
function ti(j){var t=tot(j),c=cnt(j),k=tk(),tr=j.log[k]||0;if(!j.days)return{tr:tr};
 var el=Math.floor((new Date(k+'T00:00:00')-new Date(j.start+'T00:00:00'))/864e5)+1,left=Math.max(1,j.days-el+1),g=Math.ceil((t-c+tr)/left);
 return{tr:tr,g:g,tl:Math.max(0,g-tr),el:el,left:left,diff:c-Math.ceil(t*Math.min(el,j.days)/j.days)}}
function doneToday(id){var j=gj(id),T=ti(j),f=firstUnread(j);if(T.tl>0)mark(j,f,f+T.tl-1,true);q_render()}
function ring(p,big){return '<div class="rg'+(big?' big':'')+'" style="--d:'+Math.min(100,p)*3.6+'deg"><div>'+Math.floor(p)+'%</div></div>'}
function todayBox(j){if(isDone(j))return '';var T=ti(j),f=firstUnread(j);
 if(!j.days)return '<div class="tb"><div class="mu">Today</div><div class="t">'+T.tr+' pages read</div><div class="mu">No target set \u2013 read at your own pace.</div></div>';
 var pp=T.g?Math.min(100,T.tr/T.g*100):0,late=T.el>j.days;
 return '<div class="tb"><div class="row"><div><div class="mu">\ud83c\udfaf Today\'s target</div><div class="t">'+(T.tl>0?'Read '+T.tl+' more page'+(T.tl>1?'s':''):'Done for today \u2705')+'</div></div><div style="text-align:right"><div class="mu">Day</div><b>'+Math.min(T.el,j.days)+' / '+j.days+'</b></div></div>'
  +(T.tl>0?'<div class="mu" style="margin-top:4px">Start from page <b>'+f+'</b> \u2192 page <b>'+Math.min(j.b,f+T.tl-1)+'</b></div>':'')
  +'<div class="bar"><i style="width:'+pp+'%"></i></div><div class="row mu"><span>'+T.tr+' / '+T.g+' read today</span><span>'+(late?'\u23f0 Past target date':T.diff>=0?'On track \ud83d\udc4d':'Behind by '+(-T.diff))+'</span></div></div>'}
function actions(j){var T=ti(j),m=j.days&&T.tl>0;return '<div class="row" style="margin-top:14px"><button class="btn" style="flex:1.7;width:auto" onclick="'+(m?'doneToday('+j.id+')':'openLog('+j.id+')')+'">'+(m?'\u2713 I read today\'s target':'+ Log pages')+'</button>'+(m?'<button class="btn btn2" style="flex:1;width:auto" onclick="openLog('+j.id+')">+ Log</button>':'')+'</div>'}
function sub(j){return (j.days?j.days+'-day journey':'Daily journey')+' \u00b7 Pages '+j.a+'\u2013'+j.b}
function jCard(j){var c=cnt(j),t=tot(j),u=units(j),p=c/t*100;
 var h='<div class="card"><div class="row" onclick="QV.id='+j.id+';QV.sub=\'det\';q_render()"><div style="min-width:0"><div class="t">'+q_esc(j.name)+'</div><div class="mu">'+sub(j)+'</div><div class="mu" style="margin-top:6px"><b>'+c+' / '+t+'</b> pages read</div></div>'+ring(p)+'</div>'+todayBox(j);
 if(u.length<=30)h+='<div class="grid">'+gridCells(j,u)+'</div>';
 return h+actions(j)+'</div>'}
function gridCells(j,u){return u.map(function(x,i){var f=nread(j,x.a,x.b)/(x.b-x.a+1);return '<button class="g'+(f===1?' f':f>0?' p':'')+'" onclick="tu('+j.id+','+i+')">'+(f===1?'\u2713':x.l)+'</button>'}).join('')}
function doneDate(j){return j.done||Object.keys(j.log).sort().pop()||j.start}
function cCard(j){var dd=doneDate(j),n=Math.max(1,Math.round((new Date(dd+'T00:00:00')-new Date(j.start+'T00:00:00'))/864e5)+1);
 return '<div class="card" style="border-left:5px solid var(--ok)" onclick="QV.id='+j.id+';QV.sub=\'det\';q_render()"><div class="row"><div><div class="t">\ud83c\udfc6 '+q_esc(j.name)+'</div><div class="mu" style="margin-top:4px">Completed on '+q_fmtK(dd)+'</div><div class="mu">Took '+n+' day'+(n>1?'s':'')+(j.days?' \u00b7 target '+j.days+' days '+(n<=j.days?'\u2705':'\u23f0'):'')+'</div></div><span class="badge">DONE</span></div><div class="row" style="margin-top:12px"><span class="mu">'+tot(j)+' pages</span><button class="chip" onclick="event.stopPropagation();again('+j.id+')">\ud83d\udd01 Read again</button></div></div>'}
function again(id){var j=gj(id);QS.js.push({id:Date.now(),name:j.name,a:j.a,b:j.b,u:j.u,days:j.days,start:tk(),read:{},log:{}});q_save();QV.jt='a';q_render()}
function detHTML(j){var c=cnt(j),t=tot(j),u=units(j),ks=Object.keys(j.log).sort().reverse().slice(0,30);
 var h='<div class="hero"><div class="row"><div><div style="font-size:13px;opacity:.8">'+sub(j)+'</div><div class="t" style="font-size:22px;margin:4px 0">'+q_esc(j.name)+'</div><div><b>'+c+'</b> / '+t+' pages</div><div style="font-size:13px;margin-top:2px">'+(isDone(j)?'\ud83c\udfc6 Completed':(t-c)+' pages left')+'</div></div>'+ring(c/t*100,1)+'</div></div>';
 h+=todayBox(j)+(isDone(j)?'':actions(j));
 h+='<h3>Progress</h3><div class="chips" style="margin-top:0">'+[['juz','Juz'],['surah','Surah'],['page','Pages']].map(function(x){return '<button class="chip'+(j.u===x[0]?' on':'')+'" onclick="setU('+j.id+',\''+x[0]+'\')">'+x[1]+'</button>'}).join('')+'</div><div class="mu">Tap a box to mark it read / unread</div><div class="grid">'+gridCells(j,u)+'</div>';
 h+='<h3>Daily log</h3>'+(ks.length?ks.map(function(k){return '<div class="card" style="padding:12px 16px;margin-bottom:8px"><div class="row"><span>'+q_fmtK(k)+'</span><b style="color:var(--pd)">'+j.log[k]+' pages</b></div></div>'}).join(''):'<div class="mu">No reading logged yet</div>');
 return h+'<button class="btn" style="margin-top:14px;background:#fbe3e3;color:var(--red)" onclick="delJ('+j.id+')">Delete this journey</button>'}
function openLog(id){var j=gj(id),f=firstUnread(j),T=ti(j),n=j.days&&T.tl>0?T.tl:5,t=Math.min(j.b,f+n-1);
 $('mbox').innerHTML='<div class="t" style="margin-bottom:6px">Log pages</div><div class="mu" style="margin-bottom:12px">Pages '+j.a+'\u2013'+j.b+'. Enter the pages you read.</div><div class="row"><input id="lf" type="number" inputmode="numeric" value="'+f+'"><input id="lt" type="number" inputmode="numeric" value="'+t+'"></div><div class="row" style="margin-top:4px"><button class="btn btn2" onclick="$(\'modal\').style.display=\'none\'">Cancel</button><button class="btn" onclick="doLog('+id+')">OK</button></div>';
 $('mbox').className='box qv';$('modal').style.display='flex'}
function doLog(id){var a=+$('lf').value,b=+$('lt').value;$('modal').style.display='none';if(a>0&&b>=a){mark(gj(id),a,b,true);q_render()}}
function delJ(id){QS.js=QS.js.filter(function(j){return j.id!==id});q_save();QV.sub=null;q_render()}
function rngOf(d){var fa=+d.fa||1,fb=+d.fb||fa,a,b,u='juz',nm='',x,y;
 if(d.type==='quran'){a=1;b=604;nm='My Khatm'}
 else if(d.type==='juz'){x=Math.min(fa,fb);y=Math.max(fa,fb);a=JS(x);b=JE(y);u=x===y?'page':'juz';nm='Juz '+x+(y>x?'\u2013'+y:'')}
 else if(d.type==='surah'){x=Math.min(fa,fb);y=Math.max(fa,fb);a=SS(x);b=SE(y);u=x===y?'page':'surah';nm='Surah '+NM[x-1]+(y>x?' + '+NM[y-1]:'')}
 else{a=Math.min(604,Math.max(1,fa));b=Math.min(604,Math.max(a,+d.fb||a));u='page';nm='Pages '+a+'\u2013'+b}
 return{a:a,b:b,u:u,nm:nm}}
function pvHTML(){var d=QV.d,r=rngOf(d),t=r.b-r.a+1,n=parseInt(d.days,10)||0;return '\ud83d\udcd6 Pages '+r.a+'\u2013'+r.b+' ('+t+' pages)'+(n?' \u00b7 about <b>'+Math.ceil(t/n)+' pages/day</b> for '+n+' days':'')}
function upPrev(){var e=$('pv');if(e)e.innerHTML=pvHTML()}
function preset(ty,fa,days){QV.d.type=ty;QV.d.fa=fa;QV.d.fb='';QV.d.days=days;q_render()}
function newHTML(){var d=QV.d,ty=[['quran','Full Quran'],['surah','Surah'],['juz','Juz'],['page','Pages']];
 function sel(k,n,lab,none){var v=d[k]||'',o=none?'<option value="">None \u2013 only one</option>':'';for(var i=1;i<=n;i++)o+='<option value="'+i+'"'+(String(v)===String(i)||(!none&&!v&&i===1)?' selected':'')+'>'+lab(i)+'</option>';return '<select onchange="QV.d.'+k+'=this.value;q_render()">'+o+'</select>'}
 var sl=function(i){return i+'. '+NM[i-1]},jl=function(i){return 'Juz '+i};
 var h='<div class="mu">Quick start</div><div class="chips"><button class="chip" onclick="preset(\'quran\',\'\',30)">\ud83d\udd4b Khatm in 30 days</button><button class="chip" onclick="preset(\'surah\',18,7)">Al-Kahf \u00b7 7 days</button><button class="chip" onclick="preset(\'surah\',36,3)">Ya-Sin \u00b7 3 days</button></div>'
  +'<input placeholder="Name (optional, e.g. For my dad)" value="'+q_esc(d.name)+'" oninput="QV.d.name=this.value"><div class="mu">What do you want to read?</div><div class="chips">'+ty.map(function(x){return '<button class="chip'+(d.type===x[0]?' on':'')+'" onclick="QV.d.type=\''+x[0]+'\';QV.d.fa=\'\';QV.d.fb=\'\';q_render()">'+x[1]+'</button>'}).join('')+'</div>';
 if(d.type==='surah')h+='<div class="mu">Surah</div>'+sel('fa',114,sl,0)+'<div class="mu">Add another surah (optional)</div>'+sel('fb',114,sl,1);
 else if(d.type==='juz')h+='<div class="mu">Juz</div>'+sel('fa',30,jl,0)+'<div class="mu">Add another juz (optional)</div>'+sel('fb',30,jl,1);
 else if(d.type==='page')h+='<div class="row"><input type="number" inputmode="numeric" placeholder="From page" value="'+q_esc(d.fa)+'" oninput="QV.d.fa=this.value;upPrev()"><input type="number" inputmode="numeric" placeholder="To page" value="'+q_esc(d.fb)+'" oninput="QV.d.fb=this.value;upPrev()"></div>';
 h+='<div class="mu">Finish in how many days? (optional)</div><div class="chips">'+['7','15','30',''].map(function(x){return '<button class="chip'+(String(d.days)===x?' on':'')+'" onclick="QV.d.days=\''+x+'\';q_render()">'+(x?x+' days':'No target')+'</button>'}).join('')+'</div><input type="number" inputmode="numeric" placeholder="Or type days" value="'+q_esc(d.days)+'" oninput="QV.d.days=this.value;upPrev()">';
 return h+'<div class="tb" id="pv" style="margin:0 0 14px">'+pvHTML()+'</div><button class="btn" onclick="saveJ()">Start Journey</button>'}
function saveJ(){var d=QV.d,r=rngOf(d);QS.js.push({id:Date.now(),name:d.name.trim()||r.nm,a:r.a,b:r.b,u:r.u,days:parseInt(d.days,10)||0,start:tk(),read:{},log:{}});q_save();QV.sub=null;QV.tab='j';QV.jt='a';q_render()}
function q_cal(y,m,cell){var f=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),h='<div class="cal">'+DN.map(function(d){return '<span class="h">'+d+'</span>'}).join('');for(var i=0;i<f;i++)h+='<span></span>';for(var d=1;d<=n;d++){var k=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+d).slice(-2),c=cell(k);h+='<button class="cd '+c[0]+'" onclick="'+c[1]+'">'+d+'</button>'}return h+'</div>'}
function dayTot(k){var s=0;QS.js.forEach(function(j){s+=j.log[k]||0});return s}
function q_openPick(){var d=new Date(QV.rd);QPK={y:d.getFullYear(),m:d.getMonth(),k:q_dk(d)};q_drawPick();$('mbox').className='box qv';$('modal').style.display='flex'}
function q_drawPick(){var td=tk();$('mbox').innerHTML='<div class="mu">Select date</div><div class="t" style="font-size:24px;margin:6px 0 10px">'+q_fmtK(QPK.k)+'</div><div class="row" style="margin-bottom:6px"><button class="circ" onclick="q_pkStep(-1)">\u2039</button><b>'+MN[QPK.m]+' '+QPK.y+'</b><button class="circ" onclick="q_pkStep(1)">\u203a</button></div>'+q_cal(QPK.y,QPK.m,function(k){return [(k===QPK.k?'sel':dayTot(k)>0?'part':'')+(k===td?' td':''),"q_pkSel('"+k+"')"]})+'<div class="row" style="margin-top:14px;justify-content:flex-end"><button class="chip" onclick="$(\'modal\').style.display=\'none\'">Cancel</button><button class="btn" style="width:auto;padding:10px 26px" onclick="q_pkOk()">OK</button></div>'}
function q_pkStep(n){QPK.m+=n;if(QPK.m<0){QPK.m=11;QPK.y--}if(QPK.m>11){QPK.m=0;QPK.y++}q_drawPick()}
function q_pkSel(k){QPK.k=k;q_drawPick()}
function q_pkOk(){$('modal').style.display='none';QV.rd=new Date(QPK.k+'T00:00:00').getTime();QV.rp='day';q_render()}
function q_rng(){var d=new Date(QV.rd),a,b;d.setHours(0,0,0,0);if(QV.rp==='day'){a=new Date(d);b=new Date(d)}else if(QV.rp==='week'){a=new Date(d);a.setDate(d.getDate()-d.getDay());b=new Date(a);b.setDate(a.getDate()+6)}else if(QV.rp==='month'){a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,0)}else{a=new Date(d.getFullYear(),0,1);b=new Date(d.getFullYear(),11,31)}return[a,b]}
function q_rstep(n){var d=new Date(QV.rd);if(QV.rp==='day')d.setDate(d.getDate()+n);else if(QV.rp==='week')d.setDate(d.getDate()+7*n);else if(QV.rp==='month'){d.setDate(1);d.setMonth(d.getMonth()+n)}else d.setFullYear(d.getFullYear()+n);QV.rd=d.getTime();q_render()}
function q_rgo(k,p){QV.rd=new Date((k.length>7?k:k+'-01')+'T00:00:00').getTime();QV.rp=p;q_render()}
function q_rlabel(r){var a=r[0],b=r[1];if(QV.rp==='day')return q_fmtK(q_dk(a))+(q_dk(a)===tk()?' (Today)':'');if(QV.rp==='week')return a.getDate()+' '+MN[a.getMonth()]+' \u2013 '+b.getDate()+' '+MN[b.getMonth()]+' '+b.getFullYear();if(QV.rp==='month')return MN[a.getMonth()]+' '+a.getFullYear();return String(a.getFullYear())}
function q_ovHTML(){
 var r=q_rng(),a=q_dk(r[0]),b=q_dk(r[1]),by={},days={},mon={},sum=0;
 QS.js.forEach(function(j){for(var k in j.log){if(k<a||k>b)continue;var n=j.log[k];by[j.id]=(by[j.id]||0)+n;days[k]=days[k]||{};days[k][j.id]=n;mon[k.slice(0,7)]=(mon[k.slice(0,7)]||0)+n;sum+=n}});
 var ids=Object.keys(by).sort(function(x,y){return by[y]-by[x]}),dl=Object.keys(days).sort(),span=Math.round((r[1]-r[0])/864e5)+1;
 function nm(o){return Object.keys(o).map(function(i){var j=gj(+i);return '<bdi>'+q_esc(j?j.name:'?')+'</bdi> '+o[i]}).join(' \u00b7 ')}
 var h='<div class="row" style="margin-bottom:10px"><button class="circ" onclick="q_rstep(-1)">\u2039</button><button class="chip" style="font-size:16px;font-weight:700" onclick="q_openPick()">'+q_rlabel(r)+' \ud83d\udcc5</button><button class="circ" onclick="q_rstep(1)">\u203a</button></div><div style="text-align:center;margin-bottom:12px"><button class="chip" onclick="QV.rd=Date.now();q_render()">Today</button></div>'
  +'<div class="s3"><div>\ud83d\udcd6<b>'+sum+'</b><span class="mu">Pages</span></div><div>\ud83d\udcc5<b>'+dl.length+'</b><span class="mu">Active days</span></div><div>\ud83d\udcc8<b>'+Math.round(sum/span)+'</b><span class="mu">Avg / day</span></div></div>';
 if(!sum)return h+'<div class="empty" style="margin-top:8vh"><div style="font-size:56px">\ud83d\udcd6</div><div class="t" style="margin-top:12px;color:var(--mu)">No reading recorded</div></div>';
 var acc=0,st=ids.map(function(id,i){var p=by[id]/sum*100,s=PAL[i%8]+' '+acc+'% '+(acc+p)+'%';acc+=p;return s}).join(',');
 h+='<div class="ring" style="background:conic-gradient('+st+')"><div>'+sum+'<small style="font-size:13px;font-weight:400;color:var(--mu)">pages</small></div></div><div style="margin:16px 0">'+ids.map(function(id,i){var j=gj(+id);return '<div class="row" style="padding:8px 0"><span><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:'+PAL[i%8]+';margin-right:10px;vertical-align:middle"></span><b><bdi>'+q_esc(j?j.name:'?')+'</bdi></b> <span class="mu">'+Math.round(by[id]/sum*100)+'%</span></span><b>'+by[id]+'</b></div>'}).join('')+'</div>';
 if(QV.rp==='week'||QV.rp==='month')h+='<h3>Day-wise</h3>'+dl.slice().reverse().map(function(k){var s=0;for(var i in days[k])s+=days[k][i];return '<div class="card" onclick="q_rgo(\''+k+'\',\'day\')"><div class="row"><b>'+q_fmtK(k)+'</b><b style="color:var(--pd)">'+s+' pages</b></div><div class="mu" style="margin-top:6px">'+nm(days[k])+'</div></div>'}).join('');
 if(QV.rp==='year')h+='<h3>Month-wise</h3>'+Object.keys(mon).sort().reverse().map(function(k){return '<div class="card" onclick="q_rgo(\''+k+'\',\'month\')"><div class="row"><b>'+MN[+k.slice(5)-1]+' '+k.slice(0,4)+'</b><b style="color:var(--pd)">'+mon[k]+' pages</b></div></div>'}).join('');
 return h}
function jlist(){
 var act=QS.js.filter(function(j){return !isDone(j)}),cmp=QS.js.filter(isDone).sort(function(x,y){return doneDate(y)<doneDate(x)?-1:1});
 var h='';
 if(QV.jt==='a'){var td=dayTot(tk());h+='<div class="hero"><div class="mu" style="color:#05312d;opacity:.8">Assalamu Alaikum \ud83d\udc4b</div><div class="t" style="font-size:22px;margin-top:2px">'+(td?'You read '+td+' page'+(td>1?'s':'')+' today':'Start today\'s reading')+'</div><div style="font-size:13px;margin-top:4px">'+act.length+' active journey'+(act.length===1?'':'s')+'</div></div>'}
 h+='<div class="seg"><button class="'+(QV.jt==='a'?'on':'')+'" onclick="QV.jt=\'a\';q_render()">Active ('+act.length+')</button><button class="'+(QV.jt==='c'?'on':'')+'" onclick="QV.jt=\'c\';q_render()">Completed ('+cmp.length+')</button></div>';
 if(QV.jt==='a')h+=act.length?act.map(jCard).join(''):'<div class="empty" style="margin-top:6vh"><div style="font-size:60px">\ud83d\udcd6</div><div class="t" style="margin-top:14px;color:var(--mu)">No active journeys</div><div style="margin-top:10px">Tap \u201cNew Journey\u201d to begin</div></div>';
 else h+=cmp.length?cmp.map(cCard).join(''):'<div class="empty" style="margin-top:6vh"><div style="font-size:60px">\ud83c\udfc6</div><div class="t" style="margin-top:14px;color:var(--mu)">No completed journeys yet</div></div>';
 return h}

function q_render(){render()}
function qnew(){QV.d={type:'quran',name:'',fa:'',fb:'',days:''};QV.sub='new';render()}
function qview(){var h,m,fab=false,nav=true,j;
 if(QV.sub==='new'){h=['New Journey',1];m=newHTML();nav=false}
 else if(QV.sub==='det'){j=gj(QV.id);if(!j){QV.sub=null;return qview()}h=['Journey',1];m=detHTML(j)}
 else{h=['Quran Journey',0];fab=QV.jt==='a';m=jlist()}
 return{title:h[0],back:h[1],m:'<div class="qv">'+m+(fab?'<div style="height:70px"></div>':'')+'</div>',fab:fab,nav:nav}}
function qovTabs(){return '<div class="tabs">'+[['day','Day'],['week','Week'],['month','Month'],['year','Year']].map(function(x){return '<button class="'+(QV.rp===x[0]?'on':'')+'" onclick="QV.rp=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join('')+'</div>'}
function qcele(){if(!QV.cele)return;var cj=gj(QV.cele);QV.cele=null;if(cj){$('mbox').className='box qv';$('mbox').innerHTML='<div style="text-align:center"><div style="font-size:64px">\ud83c\udf89</div><div class="t" style="font-size:22px;margin:8px 0">Alhamdulillah!</div><div class="mu" style="font-size:15px;margin-bottom:16px">You completed <b>'+q_esc(cj.name)+'</b>. May Allah accept it.</div><button class="btn" onclick="$(\'modal\').style.display=\'none\';QV.sub=null;V.tab=\'q\';V.sub=null;QV.jt=\'c\';render()">See completed</button></div>';$('modal').style.display='flex'}}

$('fab').onclick=function(){if(V.tab==='q'){qnew();return}V.sub=V.tab==='chal'?'addc':'add';render()};
render();
setTimeout(function(){$('splash').style.opacity=0;setTimeout(function(){$('splash').style.display='none'},400)},1200);
